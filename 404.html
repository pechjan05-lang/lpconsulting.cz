<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Stránka nenalezena | LP Consulting</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<style>
  @font-face{
    font-family:"Figtree"; font-style:normal; font-weight:300 900; font-display:swap;
    src:url("/fonts/figtree-latin-wght-normal.woff2") format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:"Figtree"; font-style:normal; font-weight:300 900; font-display:swap;
    src:url("/fonts/figtree-latin-ext-wght-normal.woff2") format("woff2");
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    padding:2rem 1.25rem; background:#fff; color:#233741;
    font-family:"Figtree","Segoe UI",system-ui,sans-serif; font-size:1.0625rem; line-height:1.6;
  }
  main{ max-width:30rem; }
  img{ display:block; width:9.5rem; height:auto; margin-bottom:2.5rem; }
  h1{ margin:0 0 .9rem; font-size:clamp(1.9rem,6vw,2.6rem); line-height:1.1; letter-spacing:-.02em; }
  p{ margin:0 0 1.75rem; color:#4F626D; }
  a.btn{
    display:inline-block; padding:.8rem 1.4rem; background:#233741; color:#fff;
    font-weight:600; text-decoration:none;
  }
  a.btn:hover{ background:#B3153F; }
  a:focus-visible{ outline:3px solid #B3153F; outline-offset:3px; }
</style>
</head>
<body>
<main>
  <img src="/logo.png" width="152" height="63" alt="LP Consulting">
  <h1>Tuto stránku jsme nenašli</h1>
  <p>Stránka, kterou hledáte, neexistuje nebo byla přesunuta. Pokračujte na úvodní stránku, případně nám zavolejte na <span style="white-space:nowrap">+420 774 954 054</span>.</p>
  <a class="btn" href="/">Zpět na úvodní stránku</a>
</main>
</body>
</html>
